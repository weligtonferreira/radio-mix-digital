<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/webp"
      href="/radio-mix-digital-logo-arredondada.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="text/javascript"
      src="https://hosted.muses.org/mrp.js"
    ></script>
    <title>Rádio Mix Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script class="player" type="text/javascript">
      MRP.insert({
        url: 'https://stm4.painelcast.com:6706/stream//',
        codec: 'aac',
        volume: 100,
        autoplay: true,
        forceHTML5: true,
        jsevents: false,
        buffering: 0,
        title: 'Rádio Mix Digital',
        wmode: 'transparent',
        skin: 'oldstereo',
        width: 318,
        height: 130,
      });
    </script>
  </body>
</html>
